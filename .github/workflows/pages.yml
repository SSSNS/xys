name: Deploy H5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Reassemble large build payload
        shell: bash
        run: |
          cat site/Build/WebGL.data.unityweb.part-* > site/Build/WebGL.data.unityweb
          rm site/Build/WebGL.data.unityweb.part-*
          test "$(stat -c%s site/Build/WebGL.data.unityweb)" -eq 127603035

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
